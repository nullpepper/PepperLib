name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build (test + spotless + javadoc)
        run: ./gradlew build

  # 消费者冒烟：lib 坐标发布到 mavenLocal 后，两插件以坐标依赖构建，
  # 验证契约扩展与依赖方向（lib 破坏插件编译时此处即红）。
  consumer-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Publish lib to mavenLocal
        run: ./gradlew publishToMavenLocal
      - name: Checkout PepperClaim
        uses: actions/checkout@v4
        with:
          repository: nullpepper/PepperClaim
          path: consumers/PepperClaim
      - name: Build PepperClaim
        working-directory: consumers/PepperClaim
        run: ./gradlew build
      - name: Checkout PepperUnion
        uses: actions/checkout@v4
        with:
          repository: nullpepper/PepperUnion
          path: consumers/PepperUnion
      - name: Build PepperUnion
        working-directory: consumers/PepperUnion
        run: ./gradlew build
