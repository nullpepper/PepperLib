name: CI

on:
  push:
  pull_request:

jobs:
  library-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # 根项目 + pepper-lib-plugin + pepper-lib-shaded-example：
      # 测试（含三份产物守卫）+ spotless + javadoc + shadowJar。
      - name: Build (test + spotless + javadoc + artifact guards)
        run: ./gradlew build

  # 前置模式真实 Paper 启动（文档 §9.3）：PepperLib + PepperClaim + PepperUnion 三件套。
  thin-consumer-paper-smoke:
    runs-on: ubuntu-latest
    needs: library-check
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build front-end plugin and publish lib to mavenLocal
        run: ./gradlew :pepper-lib-plugin:shadowJar publishToMavenLocal
      - name: Checkout PepperClaim
        uses: actions/checkout@v4
        with:
          repository: nullpepper/PepperClaim
          path: consumers/PepperClaim
      - name: Build PepperClaim
        working-directory: consumers/PepperClaim
        run: ./gradlew build
      - name: Checkout PepperUnion
        uses: actions/checkout@v4
        with:
          repository: nullpepper/PepperUnion
          path: consumers/PepperUnion
      - name: Build PepperUnion
        working-directory: consumers/PepperUnion
        run: ./gradlew build
      - name: Paper smoke (thin)
        run: bash scripts/paper-smoke.sh thin

  # shade 模式真实 Paper 启动（文档 §9.4）：无前置插件，relocate 后独立运行。
  shaded-consumer-paper-smoke:
    runs-on: ubuntu-latest
    needs: library-check
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build shaded example
        run: ./gradlew :pepper-lib-shaded-example:shadowJar
      - name: Paper smoke (shaded)
        run: bash scripts/paper-smoke.sh shaded

  # 低版本服务器自适应加载 smoke（文档 §4.1）：Paper 1.18.2（最低支持版本）+ Java 17，
  # 验证前置插件 plugin.yml ('1.18') 可加载且 gui-host 被自动禁用。
  legacy-consumer-paper-smoke:
    runs-on: ubuntu-latest
    needs: library-check
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25 (build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build front-end plugin
        run: ./gradlew :pepper-lib-plugin:shadowJar
      # 构建产物为 Java 17 字节码；1.18.2 服务器在 Java 17 上运行（覆盖 JAVA_HOME）。
      - name: Set up JDK 17 (smoke runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Paper smoke (legacy 1.18.2)
        run: bash scripts/paper-smoke.sh legacy
