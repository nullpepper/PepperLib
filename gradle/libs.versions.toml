# 版本目录：全部依赖/插件版本单一来源（Gradle 自动从 gradle/libs.versions.toml 加载）。
# 升级依赖只改这里；三个子项目构建文件经 libs.* 访问器引用，禁止散落硬编码版本。

[versions]
paper = "26.1.2.build.74-stable"
annotations = "26.0.1"
papi = "2.11.6"
vault = "1.7"
junit = "5.11.4"
mockbukkit = "4.115.0"
mockito = "5.23.0"
sqlite = "3.46.1.0"
aswm = "3.0.0"
# 本地构建的 ASWM fork（vjh0107，支持 MC 26.1.2）API jar；文件依赖避免 publish 依赖。
aspApiLocal = "/home/pepper/projects/aswm-build/api/build/libs/api-4.2.0-SNAPSHOT.jar"
flownbt = "1.0.0"
palantirJavaFormat = "2.97.0"
spotless = "8.9.0"
shadow = "9.2.2"
japicmp = "0.4.5"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "papi" }
vault-api = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.1.2", version.ref = "mockbukkit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
aswm-api = { module = "com.infernalsuite.aswm:api", version.ref = "aswm" }
# fork 重命名为 com.infernalsuite.asp.api；文件依赖本地构建产物（MC 26.1.2）。
asp-api = { module = "com.infernalsuite.asp:api", version = "4.2.0-SNAPSHOT" }
# flow-nbt 仅编译期满足 aswm-api 签名解析（2.0.2 在已失效 rapture 仓库，见 provider 构建注释）。
flow-nbt = { module = "com.flowpowered:flow-nbt", version.ref = "flownbt" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
japicmp = { id = "me.champeau.gradle.japicmp", version.ref = "japicmp" }
